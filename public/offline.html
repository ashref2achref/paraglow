<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#153f2b" />
  <title>ParaGlow — Hors connexion</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FBF6EC;color:#153f2b;font-family:Inter,system-ui,sans-serif;padding:24px}
    .card{width:min(520px,100%);background:#fff;border:1px solid rgba(201,160,82,.2);border-radius:28px;padding:38px;text-align:center;box-shadow:0 24px 70px rgba(21,63,43,.08)}
    .brand{font-family:Georgia,serif;font-size:34px;font-weight:700;letter-spacing:-.02em}.brand span{color:#c9a052}
    p{font-size:14px;line-height:1.7;color:rgba(21,63,43,.66);margin:18px auto 0;max-width:400px}
    button{margin-top:26px;border:0;border-radius:999px;background:#153f2b;color:#fff;padding:13px 22px;font-weight:700;cursor:pointer}
    small{display:block;margin-top:16px;color:rgba(21,63,43,.42)}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Para<span>Glow</span></div>
    <p>Vous êtes hors connexion. Les pages déjà chargées peuvent rester disponibles, et ParaGlow se reconnectera automatiquement dès que le réseau revient.</p>
    <button onclick="location.reload()">Réessayer</button>
    <small>Votre panier reste enregistré sur cet appareil.</small>
  </main>
</body>
</html>
